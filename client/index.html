<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c4dff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'%3E%3C/path%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H70 - Premium Real-time Chat & Calling</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- clmtrackr Face Tracking and PCA Face Model for AR Face Filters -->
    <script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.2/build/clmtrackr.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/clmtrackr@1.1.2/models/model_pca_20_svm.js" crossorigin="anonymous"></script>

    <script>
      // Auto-reload the page if any script or style fails to load (e.g. after a redeploy/cache bust)
      window.addEventListener('error', function(e) {
        const target = e.target || e.srcElement;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          const lastReload = sessionStorage.getItem('h70_last_reload');
          const now = Date.now();
          // Avoid infinite loops: only reload if we haven't reloaded in the last 10 seconds
          if (!lastReload || (now - parseInt(lastReload) > 10000)) {
            sessionStorage.setItem('h70_last_reload', now);
            console.warn('Asset failed to load, reloading to fetch latest version...', target.src || target.href);
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0a0b0e;
        color: #9ca3af;
        font-family: 'Inter', sans-serif;
        z-index: 9999;
      ">
        <div style="
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 3px solid rgba(124, 77, 255, 0.2);
          border-top-color: #7c4dff;
          animation: h70-spin 0.8s linear infinite;
        "></div>
        <div style="font-size: 14px; letter-spacing: 0.02em;">Connecting to H70&hellip;</div>
        <div style="font-size: 12px; color: #6b7280; max-width: 260px; text-align: center;">
          The server may be waking up from sleep — this can take up to a minute on first load.
        </div>
      </div>
      <style>
        @keyframes h70-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
